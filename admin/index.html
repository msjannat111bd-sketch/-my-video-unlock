<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>

<style>
body{
margin:0;
background:#080b12;
color:white;
font-family:Arial;
padding:15px
}

.box{
max-width:600px;
margin:auto
}

.card{
background:#121827;
padding:18px;
border-radius:16px;
margin-bottom:15px
}

input,select,textarea,button{
width:100%;
padding:13px;
margin:7px 0;
box-sizing:border-box;
border-radius:10px
}

input,select,textarea{
background:#080d17;
color:white;
border:1px solid #334155
}

button{
background:#6857ff;
color:white;
border:0;
font-weight:bold
}

.video{
border-top:1px solid #334155;
padding:12px 0
}
</style>
</head>

<body>

<div class="box">

<div class="card" id="login">

<h1>🔐 Admin Panel</h1>

<input
id="pass"
type="password"
placeholder="Admin Password"
>

<button onclick="openPanel()">
Login
</button>

</div>


<div id="panel" style="display:none">

<div class="card">

<h1>🎬 My Video Unlock</h1>

<h2>➕ Add Video</h2>

<input id="title" placeholder="Video Title">

<select id="cat">
<option>Movies</option>
<option>Dramas</option>
<option>Web Series</option>
<option>Others</option>
</select>

<input id="duration" placeholder="Duration">

<input id="thumb" placeholder="Thumbnail URL">

<input id="shot" placeholder="Screenshot URL">

<textarea
id="desc"
placeholder="Description"
></textarea>

<input
id="link"
placeholder="Telegram File Share Link"
>

<button onclick="addVideo()">
💾 Add Video
</button>

</div>


<div class="card">

<h2>📚 Videos</h2>

<input
id="search"
placeholder="🔎 Search"
oninput="showVideos()"
>

<div id="videos"></div>

</div>

</div>

</div>


<script>

let videos=[];


/* LOGIN */

function openPanel(){

let p=document.getElementById("pass").value;

if(!p){

alert("Password দিন");

return;

}

document.getElementById("login")
.style.display="none";

document.getElementById("panel")
.style.display="block";

showVideos();

}


/* ADD */

function addVideo(){

let title=
document.getElementById("title").value;

if(!title){

alert("Title দিন");

return;

}

let video={

title:title,

cat:document.getElementById("cat").value,

duration:document.getElementById("duration").value,

thumb:document.getElementById("thumb").value,

shot:document.getElementById("shot").value,

desc:document.getElementById("desc").value,

link:document.getElementById("link").value

};

videos.push(video);

localStorage.setItem(
"videos",
JSON.stringify(videos)
);

alert("✅ Video যোগ হয়েছে");

clearForm();

showVideos();

}


/* SHOW */

function showVideos(){

videos=
JSON.parse(
localStorage.getItem("videos") || "[]"
);

let q=
(document.getElementById("search")?.value || "")
.toLowerCase();

let box=
document.getElementById("videos");

box.innerHTML="";

videos.forEach((v,i)=>{

if(!v.title.toLowerCase().includes(q))
return;

box.innerHTML+=`

<div class="video">

<b>🎬 ${v.title}</b>

<p>
📂 ${v.cat}
<br>
⏱️ ${v.duration}
</p>

<button onclick="editVideo(${i})">
✏️ Edit
</button>

<button
onclick="deleteVideo(${i})"
style="background:#d33"
>
🗑️ Delete
</button>

</div>

`;

});

}


/* DELETE */

function deleteVideo(i){

if(confirm("Delete করবেন?")){

videos.splice(i,1);

localStorage.setItem(
"videos",
JSON.stringify(videos)
);

showVideos();

}

}


/* EDIT */

function editVideo(i){

let v=videos[i];

document.getElementById("title").value=v.title;

document.getElementById("cat").value=v.cat;

document.getElementById("duration").value=v.duration;

document.getElementById("thumb").value=v.thumb;

document.getElementById("shot").value=v.shot;

document.getElementById("desc").value=v.desc;

document.getElementById("link").value=v.link;

videos.splice(i,1);

localStorage.setItem(
"videos",
JSON.stringify(videos)
);

showVideos();

}


/* CLEAR */

function clearForm(){

document.getElementById("title").value="";

document.getElementById("duration").value="";

document.getElementById("thumb").value="";

document.getElementById("shot").value="";

document.getElementById("desc").value="";

document.getElementById("link").value="";

}

</script>

</body>
</html>
